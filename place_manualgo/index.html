---
layout: default
title: Basic Compatibility
script: true
---
<div class="container">
  <div id="tool-form-wrap">
  <form id="tool-form" data-tool="basic">
    <h1>PlaceAlgo - Name-Place Compatibility</h1>
    <div class="card">
      <div class="card-header"><h3>Check your name compatibility with a place</h3></div>
      <div class="card-body">
            <div class="form-row">
              <div class="form-column">
                <div class="form-group">
                  <label class="form-label" for="name">Any name (first name, middle name, last name, or maiden name)</label>
                  <input type="text" id="name" class="form-control" required>
                </div>
              </div>
              <div class="form-column">
                <div class="form-group">
                  <label class="form-label" for="place">Any place name (country, state, city, suburb, or street)</label>
                  <input type="text" id="place" class="form-control" required>
                </div>
              </div>
            </div>
            <div style="margin-top: 20px;"><input type="submit" value="Calculate Compatibility" class="btn"></div>
      </div>
    </div>
  </form>
  </div>
  <div id="tool-results" hidden></div>
</div>
