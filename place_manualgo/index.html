<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Basic Compatibility – Placealgo</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Placealgo calculates the compatibility between your name and the places you are considering moving to.">
    <link rel="icon" type="image/png" href="../assets/Favicon_Placealgo.png">
    <link rel="stylesheet" href="../assets/style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WEHSX3W3NQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WEHSX3W3NQ');
    </script>
    <script src="../assets/placealgo.js"></script>
  </head>

  <body>
    <div id="tool-alert" class="alert" role="alert" hidden></div>
    <header class="main-header">
      <nav>
        <a class="logo" href="../"><img src="../assets/Logo_Placealgo.png" alt="Placealgo"></a>
        <div class="nav-links">
          <a href="../about/">About</a>
          <a href="../science/">Science</a>
        </div>
      </nav>
    </header>
    <main class="main-container">
<div class="container">
  <div id="tool-form-wrap">
  <form id="tool-form" data-tool="basic">
    <h1>PlaceAlgo - Name-Place Compatibility</h1>
    <div class="card">
      <div class="card-header"><h3>Check your name compatibility with a place</h3></div>
      <div class="card-body">
            <div class="form-row">
              <div class="form-column">
                <div class="form-group">
                  <label class="form-label" for="name">Any name (first name, middle name, last name, or maiden name)</label>
                  <input type="text" id="name" class="form-control" required>
                </div>
              </div>
              <div class="form-column">
                <div class="form-group">
                  <label class="form-label" for="place">Any place name (country, state, city, suburb, or street)</label>
                  <input type="text" id="place" class="form-control" required>
                </div>
              </div>
            </div>
            <div style="margin-top: 20px;"><input type="submit" value="Calculate Compatibility" class="btn"></div>
      </div>
    </div>
  </form>
  </div>
  <div id="tool-results" hidden></div>
</div>
    </main>
    <footer class="main-footer">
      <div class="footer-content">
        <p>&copy; <span id="year">2026</span> Placealgo. All rights reserved.</p>
        <a href="../disclaimer/">Disclaimer</a>
        <a href="../contact/">Contact</a>
      </div>
    </footer>
    <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  </body>
</html>
